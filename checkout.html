<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Checkout</title>
  <link rel="stylesheet" href="style.css">
</head>

<body data-title="Checkout">
  <div id="site-header"></div>

  <main>
    <div class="wrap">
      <a class="back" href="index.html#books">&larr; Back to books</a>
      <p class="note" id="book-note">Loading your order...</p>

      <div class="checkout" id="checkout" hidden>
        <form class="panel" id="pay-form">
          <h2>Pay with mobile money</h2>

          <div class="field">
            <label for="phone">Mobile money number</label>
            <input id="phone" name="phone" type="tel" inputmode="tel" autocomplete="tel" placeholder="07XXXXXXXX" required>
            <p class="hint">MTN or Airtel. You will get a prompt on this phone to enter your PIN.</p>
          </div>

          <div class="field">
            <label for="email">Email address</label>
            <input id="email" name="email" type="email" autocomplete="email" placeholder="you@example.com" required>
            <p class="hint">We use this to send you a receipt.</p>
          </div>

          <label class="check">
            <input type="checkbox" id="agree" required>
            <span>I agree to the <a href="terms.html" target="_blank">Terms</a> and the <a href="refunds.html" target="_blank">Refund Policy</a>.</span>
          </label>

          <button class="btn btn-block" type="submit" id="pay-button">Pay</button>
          <p class="msg" id="form-msg" hidden></p>
        </form>

        <aside class="panel">
          <h2>Your order</h2>
          <div class="summary-book" id="summary-book"></div>
          <div class="summary-row"><span>Total</span><span id="summary-total"></span></div>
        </aside>
      </div>
    </div>
  </main>

  <div id="site-footer"></div>

  <script src="site.js"></script>
  <script type="module">
    import { db, doc, getDoc, make, makeCover, formatPrice } from "./store.js";

    const note = document.getElementById("book-note");
    const checkout = document.getElementById("checkout");
    const form = document.getElementById("pay-form");
    const message = document.getElementById("form-msg");
    const bookId = new URLSearchParams(window.location.search).get("id");

    let currentBook = null;

    function showMessage(text, isError) {
      message.textContent = text;
      message.className = isError ? "msg error" : "msg";
      message.hidden = false;
    }

    // Accepts 07XXXXXXXX or 2567XXXXXXXX
    function isUgandanNumber(text) {
      const digits = text.replace(/\D/g, "");
      return /^07\d{8}$/.test(digits) || /^2567\d{8}$/.test(digits);
    }

    async function loadOrder() {
      if (!bookId) {
        note.textContent = "Choose a book first, then press Buy.";
        return;
      }

      try {
        const snapshot = await getDoc(doc(db, "books", bookId));

        if (!snapshot.exists() || snapshot.data().published !== true) {
          note.textContent = "That book could not be found.";
          return;
        }

        currentBook = snapshot.data();
        note.textContent = "";
        checkout.hidden = false;

        const summary = document.getElementById("summary-book");
        const words = make("div");
        words.append(make("strong", "", currentBook.title || "Untitled"), make("span", "", currentBook.author || ""));
        summary.append(makeCover(currentBook, false), words);

        document.getElementById("summary-total").textContent = formatPrice(currentBook.price);
        document.getElementById("pay-button").textContent = "Pay " + formatPrice(currentBook.price);
      } catch (error) {
        console.error(error);
        note.textContent = "Your order could not be loaded. Please refresh the page.";
      }
    }

    form.addEventListener("submit", function (event) {
      event.preventDefault();

      if (!isUgandanNumber(document.getElementById("phone").value)) {
        showMessage("Enter a valid MTN or Airtel number, like 0771234567.", true);
        return;
      }

      // Payment will be connected here later.
      showMessage("Payments are not switched on yet. Please check back soon.", false);
    });

    loadOrder();
  </script>
</body>
</html>
