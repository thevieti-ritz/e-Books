<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BookCloud</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div id="site-header"></div>

  <main>
    <section class="hero">
      <div class="wrap">
        <div>
          <h1>Buy an ebook. Start reading in minutes.</h1>
          <p>Pay with MTN or Airtel mobile money and download your book straight to your phone.</p>
          <a class="btn" href="#books">Browse books</a>
        </div>
        <div class="shelf" aria-hidden="true">
          <div class="cover c-teal"></div>
          <div class="cover c-gold"></div>
          <div class="cover c-navy"></div>
        </div>
      </div>
    </section>

    <section class="section" id="books">
      <div class="wrap">
        <h2>Latest books</h2>
        <p class="sub">Pick a book, pay with mobile money, and download it right away.</p>

        <div class="tools">
          <input class="search" id="search" type="search" placeholder="Search by title or author" aria-label="Search books">
          <div class="chips" id="chips"></div>
        </div>

        <p class="note" id="book-note">Loading books...</p>
        <div class="grid" id="book-list"></div>
      </div>
    </section>
  </main>

  <div id="site-footer"></div>

  <script src="site.js"></script>
  <script type="module">
    import { fetchBooks, make, makeCover, formatPrice } from "./store.js";

    const list = document.getElementById("book-list");
    const note = document.getElementById("book-note");
    const chips = document.getElementById("chips");
    const search = document.getElementById("search");

    let allBooks = [];
    let activeCategory = "All";

    // Builds one book card.
    function makeCard(book) {
      const card = make("article", "book");

      const coverLink = make("a", "cover-link");
      coverLink.href = "book.html?id=" + encodeURIComponent(book.id);
      coverLink.append(makeCover(book));

      const titleLink = make("a", "", book.title || "Untitled");
      titleLink.href = "book.html?id=" + encodeURIComponent(book.id);
      const title = make("h3");
      title.append(titleLink);

      const row = make("div", "row");
      const buy = make("a", "buy", "Buy");
      buy.href = "checkout.html?id=" + encodeURIComponent(book.id);
      row.append(make("span", "price", formatPrice(book.price)), buy);

      card.append(coverLink, title, make("p", "author", book.author || ""), row);
      return card;
    }

    // Shows the books that match the search box and the chosen category.
    function showBooks() {
      const words = search.value.trim().toLowerCase();

      const shown = allBooks.filter(function (book) {
        const inCategory = activeCategory === "All" || book.category === activeCategory;
        const text = ((book.title || "") + " " + (book.author || "")).toLowerCase();
        return inCategory && text.includes(words);
      });

      list.innerHTML = "";
      note.textContent = shown.length ? "" : "No books match your search.";
      shown.forEach(function (book) { list.append(makeCard(book)); });
    }

    // Builds the category buttons from the categories your books use.
    function showCategoryButtons() {
      const names = [];
      allBooks.forEach(function (book) {
        if (book.category && !names.includes(book.category)) names.push(book.category);
      });

      chips.innerHTML = "";
      if (names.length < 2) return;

      ["All"].concat(names).forEach(function (name) {
        const chip = make("button", "chip", name);
        chip.type = "button";
        chip.setAttribute("aria-pressed", name === activeCategory ? "true" : "false");
        chip.addEventListener("click", function () {
          activeCategory = name;
          showCategoryButtons();
          showBooks();
        });
        chips.append(chip);
      });
    }

    async function loadBooks() {
      try {
        allBooks = await fetchBooks();

        if (allBooks.length === 0) {
          note.textContent = "No books yet. Check back soon.";
          return;
        }

        showCategoryButtons();
        showBooks();
      } catch (error) {
        console.error(error);
        note.textContent = "The books could not be loaded. Please refresh the page.";
      }
    }

    search.addEventListener("input", showBooks);
    loadBooks();
  </script>
</body>
</html>
